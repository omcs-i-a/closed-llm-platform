name: Feature request
description: Propose a scoped improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Learning or product goal
      description: What should this help us understand or do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Keep this milestone-sized.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should we know it works?
